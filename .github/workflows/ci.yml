name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_sight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forge_sight_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BUSINESS_DB_URL: sqlite+pysqlite:///./ci-business.db
      PLATFORM_DB_URL: sqlite+pysqlite:///./ci-platform.db
      POSTGRES_TEST_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/forge_sight_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Lint collaboration documents
        run: >-
          npx --yes markdownlint-cli2@0.18.1
          ".github/**/*.md"
          "docs/CI_AND_PR_WORKFLOW.md"
          "docs/tasks/GPT_DEVELOPMENT_WORKFLOW.md"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend-tests
      - frontend-tests
      - frontend-build
      - docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_RESULT: ${{ needs.backend-tests.result }}
      FRONTEND_TEST_RESULT: ${{ needs.frontend-tests.result }}
      FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
      DOCS_RESULT: ${{ needs.docs-check.result }}
    steps:
      - name: Require every quality check to pass
        run: |
          printf '%s\n' \
            "Backend Tests: $BACKEND_RESULT" \
            "Frontend Tests: $FRONTEND_TEST_RESULT" \
            "Frontend Build: $FRONTEND_BUILD_RESULT" \
            "Docs Check: $DOCS_RESULT"

          for result in \
            "$BACKEND_RESULT" \
            "$FRONTEND_TEST_RESULT" \
            "$FRONTEND_BUILD_RESULT" \
            "$DOCS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "CI Gate failed because at least one required job did not pass."
              exit 1
            fi
          done

          echo "All required jobs passed."
