name: PR Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-guard:
    name: PR Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^[A-Z]:[[:space:]].+ ]]; then
            echo "PR title must start with an uppercase task letter, for example: A: 优化实时分析体验"
            exit 1
          fi

      - name: Block local credentials and private keys
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          blocked=0
          while IFS= read -r file; do
            case "$file" in
              .env|*/.env|.env.local|*/.env.local|.env.development|*/.env.development|.env.production|*/.env.production|*.pem|*.key|*.p12|*.pfx|id_rsa|*/id_rsa)
                echo "Blocked sensitive file: $file"
                blocked=1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [ "$blocked" -ne 0 ]; then
            echo "Store local credentials only in ignored .env files or GitHub Secrets; never commit them."
            exit 1
          fi
